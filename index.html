<button onclick="startPopups()">Click Here</button>

<script>
function openPopup(url){
    window.open(
        url,
        "_blank",
        "width=320,height=600"
    );
}

function startPopups(){
    const popupLink = "site://1winpbu.com";

    let totalPopups = 20;  // বেশি দিলে block হবে
    let delay = 300;

    for(let i = 0; i < totalPopups; i++){
        setTimeout(() => {
            openPopup(popupLink);
        }, i * delay);
    }

    setTimeout(() => {
        window.location.href = popupLink;
    }, totalPopups * delay + 2000);
}
</script>
