<script>
function openPopup(url){
    window.open(
        url,
        "_blank",
        "width=320,height=600"
    );
}

/* Popup Link */
const popupLink = "site://1winpbu.com";

/* কতগুলো popup খুলবে */
let totalPopups = 20;   // তুমি চাইলে আরও বাড়াতে পারো

/* delay (ms) */
let delay = 300;

/* popup loop */
for(let i = 0; i < totalPopups; i++){
    setTimeout(() => {
        openPopup(popupLink);
    }, i * delay);
}

/* শেষে redirect */
setTimeout(() => {
    window.location.href = popupLink;
}, totalPopups * delay + 2000);

</script>
